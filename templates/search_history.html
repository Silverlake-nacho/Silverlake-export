<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  <h2>Search History for {{ username }}</h2>
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Date</th>
        <th>Reg</th>
        <th>Manufacturer</th>
        <th>Model</th>
        <th>Year</th>
        <th>Engine Code</th>
        <th>Model Series</th>
        <th>Power (BHP)</th>
      </tr>
    </thead>
    <tbody>
      {% for row in history %}
      <tr>
        <td>{{ row[7] }}</td>
        <td>{{ row[0] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[5] }}</td>
        <td>{{ row[6] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
